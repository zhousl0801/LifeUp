<!doctype html>
<html lang="zh-CN" data-theme="midnight-mint" data-color-scheme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F6FA">
<meta name="description" content="LifeUp Midnight Mint v2.1 高保真交互原型：五类资产、1+2+2 双列流光卡、4+1 悬浮胶囊导航、账单预算日历、资本积累与工资档案（虚构演示数据）。">
<title>LifeUp · Midnight Mint v2.1 高保真交互原型</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../docs/design/ui-color-tokens.css?v=20261119">
<link rel="stylesheet" href="styles.css?v=20261119">
<script src="app.js?v=20261119" defer></script>
</head>
<body>
<main class="prototype-stage">
  <header class="prototype-heading">
    <div>
      <span class="proto-eyebrow">LIFEUP · V1.4</span>
      <h1>Midnight Mint v2.1 交互原型</h1>
    </div>
    <div class="proto-controls" aria-label="原型外观切换">
      <button type="button" data-theme-pref="system">跟随系统</button>
      <button type="button" data-theme-pref="light" class="active">亮色</button>
      <button type="button" data-theme-pref="dark">暗色</button>
    </div>
  </header>

  <div class="phone" id="phone" data-page="home">
    <div class="app-content" id="app-content">
      <section class="screen active" id="screen-home"></section>
      <section class="screen" id="screen-ledger"></section>
      <section class="screen" id="screen-categories"></section>
      <section class="screen" id="screen-entry"></section>
      <section class="screen" id="screen-capital"></section>
      <section class="screen" id="screen-plans"></section>
      <section class="screen" id="screen-mine"></section>
      <section class="screen" id="screen-salary"></section>
      <section class="screen" id="screen-backup"></section>
      <section class="screen" id="screen-cash"></section>
      <section class="screen" id="screen-funds"></section>
      <section class="screen" id="screen-stocks"></section>
      <section class="screen" id="screen-provident"></section>
      <section class="screen" id="screen-gold"></section>
    </div>

    <nav class="app-nav-shell" id="app-nav" aria-label="主导航">
      <div class="nav-pill">
        <button type="button" data-nav="ledger">
          <svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="3"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>
          <span>账单</span>
        </button>
        <button type="button" data-nav="home" class="active">
          <svg viewBox="0 0 24 24"><path d="m4 10.5 8-6.5 8 6.5V19a1.5 1.5 0 0 1-1.5 1.5H5.5A1.5 1.5 0 0 1 4 19z"/><path d="M9.5 20.5v-6h5v6"/></svg>
          <span>总览</span>
        </button>
        <button type="button" data-nav="capital">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/></svg>
          <span>目标</span>
        </button>
        <button type="button" data-nav="mine">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.8"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></svg>
          <span>我的</span>
        </button>
      </div>
      <button type="button" class="nav-fab" id="nav-entry" aria-label="记一笔">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </nav>

    <div class="sheet-backdrop" id="sheet-backdrop" hidden>
      <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
        <div class="sheet-grabber"></div>
        <header class="sheet-head">
          <h2 id="sheet-title"></h2>
          <button type="button" class="sheet-close" id="sheet-close" aria-label="关闭">×</button>
        </header>
        <div class="sheet-body" id="sheet-body"></div>
      </section>
    </div>

    <div class="toast" id="toast" role="status" hidden></div>
  </div>

  <p class="prototype-caption">Midnight Mint v2.1（Daylight Prism / Obsidian Mint）· 五类资产全量交互演示 · 虚构数据，刷新重置</p>
</main>
</body>
</html>
