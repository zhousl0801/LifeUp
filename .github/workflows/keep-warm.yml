name: 保活

# Render 免费 web service 空闲 15 分钟会休眠，冷启动约 1 分钟。
# 这个工作流每 30 分钟请求一次健康检查，无法保证实例始终保持唤醒。
#
# 默认关闭；需要启用时设置仓库变量：
#   Settings → Secrets and variables → Actions → Variables
#   新建变量 KEEP_WARM_ENABLED = true
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-warm
  cancel-in-progress: false

jobs:
  warm:
    name: 唤醒免费实例
    if: vars.KEEP_WARM_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 请求健康检查
        env:
          BASE_URL: ${{ secrets.APP_BASE_URL }}
        run: |
          set -uo pipefail
          if [ -z "${BASE_URL}" ]; then
            echo "::error::缺少仓库密钥 APP_BASE_URL"
            exit 1
          fi
          if ! code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 120 "${BASE_URL%/}/api/health"); then
            echo "::error::健康检查请求失败或超时"
            exit 1
          fi
          echo "健康检查：HTTP ${code}"
          if [[ ! "$code" =~ ^2[0-9][0-9]$ ]]; then
            echo "::error::健康检查返回非成功状态码"
            exit 1
          fi
