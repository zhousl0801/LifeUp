services:
  - type: web
    name: asset-manager-api
    runtime: docker
    dockerfilePath: ./api/Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__Default
        sync: false
      # 外部定时任务（GitHub Actions）调用 /api/cron/plans/run 的共享令牌。
      # 留空则该入口关闭；生成方式：openssl rand -hex 32。
      - key: Cron__Token
        sync: false
